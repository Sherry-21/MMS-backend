basePath: /
definitions:
  payloads.BaseResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      meta: {}
      success:
        type: boolean
    type: object
  payloads.CategoryResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  payloads.CompleteStockOpnameRequest:
    properties:
      conducted_by:
        example: Staff John
        type: string
      notes:
        example: Cycle count completed and verified
        type: string
    type: object
  payloads.CountItemInput:
    properties:
      item_id:
        example: 1
        type: integer
      notes:
        example: 2 units missing / damaged
        type: string
      physical_quantity:
        example: 48
        type: integer
    type: object
  payloads.CreateCategoryRequest:
    properties:
      name:
        example: Electronics
        type: string
      slug:
        example: electronics
        type: string
    type: object
  payloads.CreateImportBatchItemRequest:
    properties:
      product_variant_id:
        example: 1
        type: integer
      quantity_received:
        example: 100
        type: integer
      unit_cost_original_currency:
        example: 12.5
        type: number
    type: object
  payloads.CreateImportBatchRequest:
    properties:
      batch_number:
        example: IMP-2026-09-001
        type: string
      currency_code:
        example: USD
        type: string
      exchange_rate:
        example: 15850.5
        type: number
      import_date:
        example: "2026-09-20T00:00:00Z"
        type: string
      items:
        items:
          $ref: '#/definitions/payloads.CreateImportBatchItemRequest'
        type: array
      supplier_name:
        example: Shenzhen Global Tech Ltd
        type: string
    type: object
  payloads.CreateProductRequest:
    properties:
      category_id:
        example: 1
        type: integer
      description:
        example: Latest Apple smartphone
        type: string
      name:
        example: iPhone 15
        type: string
      variants:
        items:
          $ref: '#/definitions/payloads.CreateProductVariantRequest'
        type: array
    type: object
  payloads.CreateProductVariantRequest:
    properties:
      image_url:
        example: https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5
        type: string
      sku:
        example: IPHONE15-BLK-128
        type: string
      variant_name:
        example: Black 128GB
        type: string
    type: object
  payloads.GenerateStockOpnameRequest:
    properties:
      notes:
        example: Morning daily random cycle count
        type: string
      sample_size:
        example: 5
        type: integer
    type: object
  payloads.ImportBatchItemResponse:
    properties:
      id:
        type: integer
      product_variant_id:
        type: integer
      quantity_received:
        type: integer
      unit_cost_idr:
        type: number
      unit_cost_original_currency:
        type: number
    type: object
  payloads.ImportBatchResponse:
    properties:
      batch_number:
        type: string
      created_at:
        type: string
      currency_code:
        type: string
      exchange_rate:
        type: number
      id:
        type: integer
      import_date:
        type: string
      items:
        items:
          $ref: '#/definitions/payloads.ImportBatchItemResponse'
        type: array
      supplier_name:
        type: string
      total_import_cost:
        type: number
    type: object
  payloads.LoginRequest:
    properties:
      password:
        example: SuperSecurePass123!
        type: string
      username:
        example: john_doe
        type: string
    type: object
  payloads.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      message:
        type: string
      refresh_token:
        type: string
      token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/payloads.UserResponse'
    type: object
  payloads.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  payloads.ProductResponse:
    properties:
      category:
        $ref: '#/definitions/payloads.CategoryResponse'
      category_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      variants:
        items:
          $ref: '#/definitions/payloads.ProductVariantResponse'
        type: array
    type: object
  payloads.ProductVariantListItemResponse:
    properties:
      category_name:
        type: string
      created_at:
        type: string
      id:
        type: integer
      image_url:
        type: string
      product_id:
        type: integer
      product_name:
        type: string
      sku:
        type: string
      variant_name:
        type: string
    type: object
  payloads.ProductVariantResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      image_url:
        type: string
      product_id:
        type: integer
      sku:
        type: string
      variant_name:
        type: string
    type: object
  payloads.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  payloads.RegisterRequest:
    properties:
      password:
        example: SuperSecurePass123!
        type: string
      username:
        example: john_doe
        type: string
    type: object
  payloads.StockOpnameDetailResponse:
    properties:
      assigned_by:
        type: string
      completed_at:
        type: string
      conducted_by:
        type: string
      created_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/payloads.StockOpnameItemResponse'
        type: array
      notes:
        type: string
      opname_date:
        type: string
      opname_number:
        type: string
      status:
        type: string
      total_discrepancy:
        type: integer
      total_items:
        type: integer
      updated_at:
        type: string
    type: object
  payloads.StockOpnameItemResponse:
    properties:
      created_at:
        type: string
      discrepancy:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      notes:
        type: string
      physical_quantity:
        type: integer
      product_name:
        type: string
      product_variant_id:
        type: integer
      sku:
        type: string
      status:
        type: string
      stock_opname_id:
        type: integer
      system_quantity:
        type: integer
      updated_at:
        type: string
      variant_name:
        type: string
    type: object
  payloads.StockOpnameResponse:
    properties:
      assigned_by:
        type: string
      completed_at:
        type: string
      conducted_by:
        type: string
      created_at:
        type: string
      id:
        type: integer
      notes:
        type: string
      opname_date:
        type: string
      opname_number:
        type: string
      status:
        type: string
      total_discrepancy:
        type: integer
      total_items:
        type: integer
      updated_at:
        type: string
    type: object
  payloads.SubmitStockOpnameCountRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/payloads.CountItemInput'
        type: array
    type: object
  payloads.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  payloads.UserResponse:
    properties:
      created_at:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@maiora.com
    name: Maiora Support Team
  description: Robust backend API service for Maiora System built with Go and Chi
    router.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Maiora System Backend API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user with username and password
      parameters:
      - description: User Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payloads.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.LoginResponse'
              type: object
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: User login
      tags:
      - Authentication
  /api/v1/auth/me:
    get:
      description: Retrieves the profile information of the currently authenticated
        user
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated user details
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get current authenticated user profile
      tags:
      - Authentication
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a newly rotated access token
        and refresh token pair
      parameters:
      - description: Refresh Token Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payloads.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.TokenResponse'
              type: object
        "400":
          description: Missing or invalid payload
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Refresh access token
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user account with a unique username and securely
        hashed password
      parameters:
      - description: User Registration Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payloads.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.UserResponse'
              type: object
        "400":
          description: Invalid request input or validation error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "409":
          description: Username is already taken
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Register a new user
      tags:
      - Authentication
  /api/v1/categories:
    get:
      description: Retrieves all product categories ordered alphabetically
      produces:
      - application/json
      responses:
        "200":
          description: Categories retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/payloads.CategoryResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: List all product categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Creates a new product category with automated or custom slug
      parameters:
      - description: Category Creation Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payloads.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Category created successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.CategoryResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "409":
          description: Slug already exists
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Create a product category
      tags:
      - Categories
  /api/v1/import-batches:
    post:
      consumes:
      - application/json
      description: Creates an import batch, line items, and auto-populates inventory
        batches in a single transaction
      parameters:
      - description: Import Batch Registration Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payloads.CreateImportBatchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Import batch registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.ImportBatchResponse'
              type: object
        "400":
          description: Invalid request payload or validation error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Register a new import batch
      tags:
      - Import Batches
  /api/v1/product-variants:
    get:
      description: Retrieves list of all variants/SKUs (ideal for Import Batch search/dropdowns)
      parameters:
      - description: Search SKU or variant name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Variants retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/payloads.ProductVariantListItemResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: List product variants (SKUs)
      tags:
      - Products
  /api/v1/products:
    get:
      description: Retrieves paginated list of products with optional search and category
        filter
      parameters:
      - description: Search name or description
        in: query
        name: search
        type: string
      - description: Filter by category ID
        in: query
        name: category_id
        type: integer
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size limit (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Products retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/payloads.ProductResponse'
                  type: array
                meta:
                  $ref: '#/definitions/payloads.PaginationMeta'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: List products
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Creates a new product catalog item with optional inline variants
      parameters:
      - description: Product Creation Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payloads.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Product created successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.ProductResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Create a product
      tags:
      - Products
  /api/v1/products/{id}:
    get:
      description: Retrieves full product details including category and variants
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Product retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.ProductResponse'
              type: object
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Get product by ID
      tags:
      - Products
  /api/v1/products/{id}/variants:
    post:
      consumes:
      - application/json
      description: Creates a new SKU variant for an existing product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product Variant Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payloads.CreateProductVariantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Variant created successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.ProductVariantResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "409":
          description: SKU already exists
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Add a variant to a product
      tags:
      - Products
  /api/v1/stock-opnames:
    get:
      description: Retrieves paginated history of all stock opname audits with optional
        status and date filters
      parameters:
      - default: 1
        description: Page number (default 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (default 20)
        in: query
        name: limit
        type: integer
      - description: Filter by status (PENDING, IN_PROGRESS, COMPLETED, CANCELLED)
        in: query
        name: status
        type: string
      - description: Start date filter (YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: End date filter (YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Stock opnames history
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/payloads.StockOpnameResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: List stock opname record history
      tags:
      - Stock Opname
  /api/v1/stock-opnames/{id}:
    get:
      description: Retrieves detailed information and all audited line items of a
        stock opname session
      parameters:
      - description: Stock Opname ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Stock opname details
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.StockOpnameDetailResponse'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "404":
          description: Stock opname not found
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Get stock opname session by ID
      tags:
      - Stock Opname
  /api/v1/stock-opnames/{id}/complete:
    post:
      consumes:
      - application/json
      description: Marks stock opname session as COMPLETED, calculates total discrepancy,
        and records completion timestamp
      parameters:
      - description: Stock Opname ID
        in: path
        name: id
        required: true
        type: integer
      - description: Completion details
        in: body
        name: request
        schema:
          $ref: '#/definitions/payloads.CompleteStockOpnameRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Stock opname completed successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.StockOpnameDetailResponse'
              type: object
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "404":
          description: Stock opname not found
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "409":
          description: Stock opname already completed
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Finalize and complete stock opname session
      tags:
      - Stock Opname
  /api/v1/stock-opnames/{id}/count:
    post:
      consumes:
      - application/json
      description: Records physical inventory counts for items in an active stock
        opname session and calculates discrepancies
      parameters:
      - description: Stock Opname ID
        in: path
        name: id
        required: true
        type: integer
      - description: Audited item counts
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/payloads.SubmitStockOpnameCountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Counts recorded successfully
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/payloads.StockOpnameDetailResponse'
              type: object
        "400":
          description: Invalid payload or parameters
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "404":
          description: Stock opname or item not found
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "409":
          description: Stock opname already completed
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payloads.BaseResponse'
      summary: Submit physical counts for stock opname items
      tags:
      - Stock Opname
  /api/v1/stock-opnames/generate-daily:
    post:
      consumes:
      - application/json
      description: Randomly samples product variants from inventory and generates
        a stock opname audit session for today
      parameters:
      - description: Opname generation options
        in: body
        name: request
        schema:
          $ref: '#/definitions/payloads.GenerateStockOpnameRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Stock opname generated or active retrieved
          schema:
            allOf:
            - $ref: '#/definitions/payloads.BaseResponse'
